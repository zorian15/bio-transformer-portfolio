[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biotp"
version = "0.0.1"
description = "Shared infrastructure for the bio-transformer-portfolio experiments (ESM-2 embeddings, fine-tuning, leakage-aware evaluation, releases)."
requires-python = ">=3.11"
dependencies = []  # runtime deps are managed via environment.yml (mamba env 'biollm')

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biotp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The test modules share their encoder stubs via `from conftest import ...`, see
# tests/conftest.py. That resolves under the default prepend import mode as a
# side effect of `tests/` having no __init__.py, and would stop resolving under
# --import-mode=importlib. Putting it on the path explicitly makes the import a
# stated arrangement rather than an accident of the default.
pythonpath = ["tests"]
# Network tests download model checkpoints, so they are opt-in: run them with
# `pytest -m network`. The default suite stays fast and works offline. CI opts
# back in, in .github/workflows/embedding-anchor.yml, so the frozen-reference
# check does not depend on a human remembering (issue #8).
#
# --strict-markers because a mistyped or renamed marker otherwise selects nothing
# and the suite stays green while a load-bearing test quietly stops running.
addopts = "-ra --strict-markers -m 'not network'"
markers = [
    "network: downloads model weights or queries a remote API",
]
# Strict xfail: a scaffold stub's contract tests fail loudly once it starts
# working, which is the signal to drop the marker rather than leave the test
# permanently and silently skipped.
xfail_strict = true

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.coverage.run]
# Branch coverage, not just line coverage. A guard clause whose body never runs
# is fully line-covered while half its behavior is untested, and the readout and
# split checks in this codebase are mostly branches. Set here rather than left to
# the caller so a local `pytest --cov=biotp` measures the same thing the PR gate
# does, and the two cannot report different numbers for the same commit.
branch = true

[tool.coverage.report]
# The floor, read both by a local `pytest --cov=biotp` and by the coverage review
# agent on a PR. The two apply it to different denominators: locally it gates the
# whole package, and on a PR it gates only the lines that PR touched. Patch
# coverage is the stricter reading, since a small diff has nowhere to hide behind
# an already well-tested codebase.
fail_under = 80
# Name the uncovered lines, so a number under the floor is actionable rather than
# sending the reader back to run the tool again with different flags.
show_missing = true
