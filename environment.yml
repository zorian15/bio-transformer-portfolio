name: biollm
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - jupyterlab
  # PyTorch comes from conda-forge, not pip, so the env holds exactly one OpenMP
  # runtime. The pip wheel bundles its own libomp.dylib alongside the env's copy,
  # and importing torch then aborts the process with "OMP: Error #15" (SIGABRT)
  # rather than raising, which takes down anything that imports it, pytest
  # included. The conda-forge build symlinks torch/lib/libomp.dylib to the env's
  # libomp instead, so there is nothing to clash. MPS is enabled in this build,
  # which the local Apple-Silicon path depends on.
  - pytorch>=2.13
  # Remaining ML / transformers stack via pip, to track the latest wheels.
  - pip:
      - transformers
      # datasets and accelerate were dropped: nothing in the repo imports
      # either, and datasets is what pinned pyarrow>=21, whose sdist needs a
      # Rust toolchain to build when no wheel matches the interpreter.
      - peft            # LoRA / parameter-efficient fine-tuning
      - sentence-transformers
      - fair-esm        # ESM-2 protein language models
      - huggingface_hub
      - black
      - ruff
      - mypy
      - pytest
      # Coverage measurement, for reviewing which lines a PR's tests actually
      # reach. Deliberately not wired into `addopts`: coverage instruments every
      # call and would slow the default suite for every run, when what it is for
      # is an occasional `pytest --cov=biotp` during review.
      - pytest-cov
      # Already arrives transitively via transformers and datasets, but declared
      # because tests/test_conventions.py parses the CI workflows with it, and a
      # test should not rest on another package happening to pull it in.
      - pyyaml
      # Docs site (mkdocs build / mkdocs serve). The readthedocs theme ships
      # with mkdocs itself, so no theme package is needed; pymdown-extensions
      # supplies arithmatex (the metric equations) and superfences.
      # Pinned below 2.0, which removes the plugin and theming systems with no
      # migration path and would break mkdocs.yml at the next env rebuild.
      - mkdocs>=1.6,<2
      - pymdown-extensions>=10,<12
